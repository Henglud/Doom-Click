<title>DOOM CLICK</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#09051a;color:#fff}
body{background:radial-gradient(circle at 50% 18%,#5b0a70 0,#24104e 28%,#0a0820 62%,#03030a 100%);background-attachment:fixed}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 20% 20%,rgba(255,45,170,.16),transparent 28%),radial-gradient(circle at 80% 30%,rgba(39,220,255,.12),transparent 30%),linear-gradient(135deg,transparent 0 48%,rgba(255,255,255,.018) 50%,transparent 52%);background-size:auto,auto,32px 32px}
button{font:inherit;color:#fff;border:0;cursor:pointer;touch-action:manipulation}

.logo{font-size:30px;font-weight:1000;letter-spacing:4px;background:linear-gradient(90deg,#fff,#ff64dc 42%,#64edff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px rgba(255,68,220,.45);filter:drop-shadow(0 0 8px rgba(160,80,255,.3))}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:10px 14px;border-radius:15px;background:linear-gradient(135deg,rgba(52,21,89,.9),rgba(24,13,55,.95));border:1px solid rgba(180,91,255,.6);font-weight:900;box-shadow:0 0 18px rgba(124,61,255,.2),inset 0 1px 0 rgba(255,255,255,.08)}.crystal{color:#bffcff;text-shadow:0 0 10px #36eaff}
main{flex:1;display:grid;grid-template-columns:235px 1fr 235px;gap:18px;padding:16px;min-height:0}
.panel{background:linear-gradient(180deg,rgba(24,10,49,.88),rgba(10,7,25,.78));border:1px solid rgba(147,69,225,.5);border-radius:22px;padding:13px;overflow:auto;box-shadow:0 18px 45px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.panel h2{font-size:15px;margin:4px 0 10px;color:#dfb8ff;text-transform:uppercase;letter-spacing:1px}
.upgrade{width:100%;text-align:left;padding:11px;margin:7px 0;border-radius:13px;background:linear-gradient(135deg,#271052,#3c1661);border:1px solid #8b4dcc}.upgrade:active{transform:scale(.98)}.upgrade:hover{filter:brightness(1.2);transform:translateY(-1px)}
.upgrade small{display:block;color:#cbb5d9;margin-top:4px;line-height:1.25}.upgrade b{display:block;font-size:14px}
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:8px 10px}
.level{font-weight:900;color:#e9d0ff;font-size:18px}.bar{width:min(600px,85%);height:13px;background:#160b29;border-radius:20px;overflow:hidden;border:1px solid #6539a0;margin:8px 0 15px}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff35ca,#6c5cff,#39f6ff);box-shadow:0 0 16px #ad6cff}
.doom{width:min(330px,65vw);height:min(330px,65vw);border-radius:50%;position:relative;background:radial-gradient(circle at 35% 28%,#ffcb5c 0 5%,#d83850 7%,#721d65 32%,#250c4b 67%,#0b051a 100%);border:7px solid #bd54ff;box-shadow:0 0 30px #d447ff,0 0 90px #6a36ff66,inset 0 0 40px #ff265a66;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;transition:transform .08s}
.doom:after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed #ffb7ff55;animation:spin 12s linear infinite}.doom span{font-size:58px;filter:drop-shadow(0 0 12px #ffda7a);z-index:1}.doom.hit{transform:scale(.95) rotate(-1deg)}
@keyframes spin{to{transform:rotate(360deg)}} .float{position:absolute;font-weight:900;font-size:22px;pointer-events:none;animation:float 850ms ease-out forwards;text-shadow:0 0 10px #fff}
@keyframes float{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.25)}}
.big{font-size:34px;font-weight:1000;margin:8px;text-shadow:0 0 18px rgba(255,255,255,.12)}.sub{color:#d7c6e8;margin-bottom:8px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.action{padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#7436ff,#d72cff 48%,#ff3b91);box-shadow:0 8px 28px rgba(141,55,255,.28),inset 0 1px 0 rgba(255,255,255,.18);font-weight:1000;border:1px solid rgba(255,255,255,.12);transition:transform .15s,filter .15s,box-shadow .15s}.action:hover{filter:brightness(1.14);transform:translateY(-2px);box-shadow:0 12px 34px rgba(210,45,255,.35)}.action:disabled{opacity:.4;cursor:not-allowed}
.event{margin-top:12px;width:min(650px,90%);padding:12px;border-radius:16px;text-align:center;background:linear-gradient(90deg,#43116a,#74145d);border:1px solid #e05cff;animation:pulse 1.3s infinite}.event b{display:block;font-size:18px}@keyframes pulse{50%{box-shadow:0 0 25px #f24cff66}}
#toast{position:fixed;left:50%;top:82px;transform:translateX(-50%);z-index:30;padding:13px 20px;border-radius:15px;background:#241044;border:1px solid #d96cff;opacity:0;pointer-events:none;transition:.25s;text-align:center;font-weight:900}#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#03010bcc;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal.open{display:flex}.box{width:min(620px,95vw);max-height:90vh;overflow:auto;background:#140a28;border:1px solid #a654e9;border-radius:22px;padding:20px;box-shadow:0 0 70px #8b37ff66}.box h1{margin-top:0}.close{float:right;background:#3b1c55;padding:7px 12px;border-radius:10px}.achievement{display:flex;justify-content:space-between;gap:10px;padding:10px;margin:7px 0;border-radius:12px;background:#211039;border:1px solid #4d2a68}.locked{opacity:.42}.wheel{margin:15px auto;width:260px;height:260px;border-radius:50%;border:12px solid #e2a6ff;background:conic-gradient(#ff3f9d 0 45deg,#713dff 45deg 90deg,#32dfff 90deg 135deg,#ffb52f 135deg 180deg,#ff3f9d 180deg 225deg,#713dff 225deg 270deg,#32dfff 270deg 315deg,#ffb52f 315deg 360deg);position:relative;box-shadow:0 0 30px #bb55ff88;transition:transform 2.4s cubic-bezier(.12,.7,.15,1)}.wheel:after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:55px;color:#fff;text-shadow:0 0 15px #000}.pointer{margin:auto;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 0 5px #fff)}select{width:100%;padding:11px;background:#25113b;color:#fff;border:1px solid #7642a4;border-radius:10px;margin:6px 0 14px}
@media(max-width:850px){header{height:62px;padding:8px 10px}.logo{font-size:20px}.stats{gap:5px}.pill{padding:7px 8px;font-size:12px}main{display:flex;padding:8px}.panel{display:none}.center{width:100%}.doom{width:min(72vw,310px);height:min(72vw,310px)}.big{font-size:26px}.actions{margin-top:10px}.event{width:94%}}

.saleTicker{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:50;width:min(760px,78vw);height:34px;overflow:hidden;background:linear-gradient(90deg,rgba(255,45,140,.16),rgba(255,190,45,.18),rgba(0,230,255,.16));border:1px solid rgba(255,180,80,.5);border-top:0;border-radius:0 0 14px 14px;box-shadow:0 8px 30px rgba(255,80,160,.18);backdrop-filter:blur(10px)}
.saleTicker:before{content:"🔥";position:absolute;left:12px;top:7px;z-index:2}.saleTickerTrack{white-space:nowrap;display:inline-block;padding-left:45px;line-height:34px;font-size:12px;font-weight:1000;letter-spacing:1.5px;color:#fff1b0;animation:tickerMove 14s linear infinite}@keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-55%)}}
.upgrade.saleActive,.skinCard.saleActive{border-color:#ffd15c;box-shadow:0 0 18px rgba(255,191,58,.22)}.saleBadge{display:inline-block;margin-left:5px;padding:2px 5px;border-radius:6px;background:#ff3b78;color:#fff;font-size:10px;font-weight:900;vertical-align:middle;animation:salePulse 1s ease-in-out infinite alternate}@keyframes salePulse{to{transform:scale(1.06);filter:brightness(1.18)}}
.leaderboardPanel{margin-top:14px;flex:1;min-height:260px;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}.lbHead{display:flex;flex-direction:column;gap:9px}.lbHead>span{font-size:14px;font-weight:1000;letter-spacing:1.2px}.lbTabs{display:flex;gap:6px}.lbTab{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#bdb2d2;border-radius:8px;padding:6px 4px;font-size:9px;font-weight:1000;cursor:pointer}.lbTab.active{color:#fff;background:linear-gradient(90deg,rgba(166,74,255,.55),rgba(255,54,151,.45));border-color:rgba(255,130,220,.5)}.leaderboardList{margin-top:9px;overflow-y:auto;min-height:0;padding-right:4px;scrollbar-width:thin}.lbRow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;padding:8px 7px;margin-bottom:5px;border-radius:9px;background:rgba(255,255,255,.035);font-size:10px}.lbRank{font-weight:1000;color:#ffd86a}.lbName{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbValue{font-weight:1000;color:#8ffcff}.panel:nth-child(3){display:flex;flex-direction:column;min-height:0}.statCard{flex:none}.bar .fill{transition:width .55s cubic-bezier(.22,.8,.2,1)}
</style>

<style>
.rebirthCard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin:10px 0;text-align:left}

.rebirthCard.next{box-shadow:0 0 20px rgba(180,80,255,.12)}
.soundPreview{margin:8px 0;color:#d8c8df}
#clickTarget{transition:transform .18s ease,filter .2s ease,box-shadow .25s ease,border-radius .3s ease}

#clickTarget.level7{width:286px;height:258px;border-radius:50% 50% 30% 70%/35% 70% 30% 65%;background:radial-gradient(circle at 50% 55%,#fff0a8 0 8%,#ff4a3d 22%,#e019ff 46%,#3e2bdb 70%,#090313 100%);box-shadow:0 0 70px rgba(224,25,255,.52),inset 0 0 46px #000}
#clickTarget.level8{width:298px;height:270px;border-radius:67% 33% 45% 55%/48% 56% 44% 52%;background:repeating-conic-gradient(from 0deg,#151023 0 10deg,#8c36ff 10deg 20deg,#ff2d8d 20deg 30deg);box-shadow:0 0 78px rgba(255,45,141,.52),inset 0 0 52px #000}
#clickTarget.level9{width:310px;height:282px;border-radius:38% 62% 68% 32%/63% 37% 50% 50%;background:radial-gradient(circle,#ffffff 0 4%,#7ffaff 10%,#4c55ff 26%,#cf22ff 45%,#240b4f 72%,#030108 100%);box-shadow:0 0 90px rgba(127,250,255,.58),0 0 130px rgba(207,34,255,.28),inset 0 0 58px #000}
#clickTarget.level10{width:324px;height:294px;border-radius:50% 50% 50% 50%;background:radial-gradient(circle,#fff 0 3%,#fff2a8 8%,#ff7b35 18%,#ff2d55 34%,#c51aff 52%,#4c1b91 73%,#05010a 100%);box-shadow:0 0 100px rgba(255,123,53,.75),0 0 170px rgba(197,26,255,.38),inset 0 0 65px #000;animation:doomPulse 1.6s ease-in-out infinite alternate}
@keyframes doomPulse{from{filter:brightness(.92) saturate(1)}to{filter:brightness(1.2) saturate(1.35)}}

 #clickTarget.level1{width:190px;height:190px}
 #clickTarget.level2{width:198px;height:180px}

<style>

<style>

<body>
<div id="app"><div id="saleTicker" class="saleTicker" style="display:none"><div id="saleTickerTrack"></div></div>
<header><div class="logo">DOOM CLICK</div><div class="stats"><div class="pill">💰 <span id="coins">0</span></div><div class="pill crystal">💎 <span id="crystals">0</span></div><div class="pill">♻️ <span id="rebirth">0</span></div></div></header>
<main>
<section class="panel"><h2>⚡ Upgrades</h2><div id="upgrades"></div></section>

const CLICK_SOUNDS={
  meme:[
    ['vine','Vine Boom'],['popcat','Pop Cat'],['bonk','Bonk'],['error','Windows Error'],['bruh','Bruh'],['airhorn','Air Horn']
  ],
  popular:[
    ['coin','Arcade Coin'],['hit','Impact Hit'],['laser','Laser Zap'],['blip','Retro Blip'],['power','Power Up'],['spark','Electric Spark']
  ],
  calm:[
    ['soft','Soft Tap'],['bubble','Bubble Pop'],['wood','Wood Tap'],['glass','Soft Glass'],['chime','Gentle Chime'],['bell','Small Bell']
  ],

    ['bass','Bass Drop'],['explosion','Mini Explosion'],['shock','Shockwave'],['metal','Metal Hit'],['whoosh','Fast Whoosh'],['doom','Doom Pulse']

function previewClickSound(){
  const was=s.sfx;s.sfx=true;playClickSound();s.sfx=was;
  const b=document.getElementById('soundPreviewBtn');
  if(b){b.classList.add('previewing');setTimeout(()=>b.classList.remove('previewing'),220);}
}

function playClickSound(){
  if(!s.sfx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!window.__audioCtx)window.__audioCtx=new AC();
    const ctx=window.__audioCtx, now=ctx.currentTime, type=s.clickSound||'coin';
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.connect(f);f.connect(g);g.connect(ctx.destination);
    let start=300,end=180,dur=.09,wave='square';
    if(type==='vine'){start=90;end=35;dur=.16;wave='sawtooth'}
    if(type==='popcat'){start=220;end=520;dur=.07;wave='triangle'}
    if(type==='bonk'){start=180;end=65;dur=.13;wave='square'}
    if(type==='error'){start=480;end=180;dur=.12;wave='square'}
    if(type==='bruh'){start=110;end=70;dur=.24;wave='sawtooth'}
    if(type==='airhorn'){start=220;end=120;dur=.22;wave='sawtooth'}
    if(type==='coin'){start=760;end=1160;dur=.09;wave='triangle'}
    if(type==='hit'){start=150;end=90;dur=.07;wave='square'}
    if(type==='laser'){start=1000;end=220;dur=.13;wave='sawtooth'}
    if(type==='blip'){start=500;end=800;dur=.06;wave='square'}
    if(type==='power'){start=280;end=980;dur=.25;wave='sine'}
    if(type==='spark'){start=900;end=1600;dur=.08;wave='sine'}
    if(type==='soft'){start=380;end=260;dur=.08;wave='sine'}
    if(type==='bubble'){start=650;end=220;dur=.11;wave='sine'}
    if(type==='wood'){start=180;end=110;dur=.08;wave='triangle'}
    if(type==='glass'){start=1100;end=900;dur=.12;wave='sine'}
    if(type==='chime'){start=700;end=980;dur=.24;wave='sine'}
    if(type==='bell'){start=560;end=420;dur=.28;wave='sine'}
    if(type==='bass'){start=90;end=42;dur=.28;wave='sawtooth'}
    if(type==='explosion'){start=120;end=28;dur=.2;wave='sawtooth'}
    if(type==='shock'){start=180;end=35;dur=.16;wave='square'}
    if(type==='metal'){start=420;end=120;dur=.14;wave='square'}
    if(type==='whoosh'){start=250;end=1400;dur=.18;wave='sawtooth'}
    if(type==='doom'){start=70;end=34;dur=.32;wave='sine'}
    o.type=wave;o.frequency.setValueAtTime(start,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),now+dur);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.13,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    f.type='lowpass';f.frequency.setValueAtTime(4000,now);
    o.start(now);o.stop(now+dur+.02);
  }catch(e){}
}
function soundName(key){
  for(const group of Object.values(CLICK_SOUNDS)){
    const found=group.find(x=>x[0]===key);
    if(found)return found[1];
  }
  return 'Arcade Coin';
}

let pendingOfflineReward=0;

function previewSoundById(id){const old=s.clickSound;s.clickSound=id;const was=s.sfx;s.sfx=true;playClickSound();s.sfx=was;s.clickSound=old}
function saleDiscount(id){
  const hit=(s.saleOffers||[]).find(x=>x.id===id && x.until>Date.now());
  return hit?hit.discount:0;
}
function discounted(value,id){return Math.max(1,Math.floor(value*(1-saleDiscount(id)/100)))}
function upgradeCost(i){const a=A[i],lvl=s.upgrades[i]||0;return Math.floor(a.cost*Math.pow(1.75,lvl))}
function skinCost(k){return {coin:k.coin?discounted(k.coin,'skin:'+k.id):0,crystal:k.crystal?discounted(k.crystal,'skin:'+k.id):0}}
function saleText(id){const d=saleDiscount(id);return d?` <span class="saleBadge">-${d}%</span>`:''}
function startSale(){
  const pool=[...A.map((_,i)=>'upg:'+i),...SKINS.filter(k=>k.id!=='classic').map(k=>'skin:'+k.id),'wheel'];
  const shuffled=pool.sort(()=>Math.random()-.5);
  const count=3+Math.floor(Math.random()*2);
  const duration=30000+Math.floor(Math.random()*45000);
  s.saleOffers=shuffled.slice(0,count).map(id=>({id,discount:[15,20,25,30,35,40][Math.floor(Math.random()*6)],until:Date.now()+duration}));
  s.saleNextAt=Date.now()+90000+Math.random()*150000;
  toast(s.lang==='ru'?'🔥 НОВАЯ АКЦИЯ! Скидки уже появились!':'🔥 NEW SALE! Discounts are live!');
  save();render();renderLeaderboard();
}
function updateSales(){
  const now=Date.now();
  s.saleOffers=(s.saleOffers||[]).filter(x=>x.until>now);
  if(now>=s.saleNextAt && !s.saleOffers.length)startSale();
}
function buySkin(id){
 const k=SKINS.find(x=>x.id===id); if(!k)return;
 if(s.ownedSkins.includes(id)){s.skin=id;applySkin();save();showShop();return}
 const price=skinCost(k);
 if(s.coins<price.coin||s.crystals<price.crystal){toast(tr('notEnough'));return}
 s.coins-=price.coin;s.crystals-=price.crystal;s.ownedSkins.push(id);s.skin=id;applySkin();save();showShop();render()
}
function showShop(){
 modalContent.innerHTML=`<h1>🎨 ${s.lang==='ru'?'Магазин оформления':'Interface Shop'}</h1>
 <p>${s.lang==='ru'?'Только внешний вид. Не меняет силу, доход или шансы.':'Cosmetic only. No effect on power, income or chances.'}</p>
 <div class="cosmeticGrid">${SKINS.map(k=>{const owned=s.ownedSkins.includes(k.id),active=s.skin===k.id,price=skinCost(k),d=saleDiscount('skin:'+k.id);
   const parts=[]; if(k.coin)parts.push(`<span ${d?'style="text-decoration:line-through;opacity:.55"':''}>${fmt(k.coin)} 💰</span>`); if(k.crystal)parts.push(`<span ${d?'style="text-decoration:line-through;opacity:.55"':''}>${fmt(k.crystal)} 💎</span>`);
   const oldCost=parts.filter(Boolean).join(' + ')||'FREE';
   const discountedParts=[]; if(k.coin)discountedParts.push(`${fmt(price.coin)} 💰`); if(k.crystal)discountedParts.push(`${fmt(price.crystal)} 💎`);
   const cost=owned?'OWNED':(d?discountedParts.join(' + '):oldCost);
   return `<div class="skinCard ${d?'saleActive':''}"><div class="skinPreview" style="background:${k.preview}"></div><b>${k.name}${d?saleText('skin:'+k.id):''}</b><small>${k.desc}</small><div>${cost}</div><button class="action compact" onclick="buySkin('${k.id}')">${active?'ACTIVE':owned?'APPLY':'BUY'}</button></div>`}).join('')}</div>`
}
function showGoals(){
 modalContent.innerHTML=`<h1>🎯 ${s.lang==='ru'?'Цели дня':'Daily Trials'}</h1>
 <p>${s.lang==='ru'?'Гарантированные награды за понятные задачи. Без ставок и потери ресурсов.':'Guaranteed rewards for clear goals. No betting or resource loss.'}</p>
 <div class="goalsGrid">${DAILY_GOALS.map(g=>{const key=g.id.startsWith('clicks')?'clicks':g.id,cur=Math.min(g.goal,s.goalStats[key]||0),done=cur>=g.goal,claimed=!!s.goalClaimed[g.id];
 return `<div class="goalCard"><b>${g.text}</b><div class="goalBar"><span style="width:${cur/g.goal*100}%"></span></div><small>${fmt(cur)} / ${fmt(g.goal)}</small><button class="action compact" ${done&&!claimed?'':'disabled'} onclick="claimGoal('${g.id}')">${claimed?'CLAIMED':done?'CLAIM':'LOCKED'} · +${g.reward} 💎</button></div>`}).join('')}</div>`
}
function claimGoal(id){const g=DAILY_GOALS.find(x=>x.id===id);if(!g||s.goalClaimed[id])return;const key=g.id.startsWith('clicks')?'clicks':g.id;if((s.goalStats[key]||0)<g.goal)return;s.goalClaimed[id]=1;addCrystals(g.reward);toast('🎯 +'+g.reward+' 💎');save();render();showGoals()}

 <button class="upgrade" onclick="s.music=!s.music;save();showSettings()">${tr('music')}: ${s.music?tr('on'):tr('off')}</button>
 <button class="upgrade" onclick="s.sfx=!s.sfx;save();showSettings()">${tr('sounds')}: ${s.sfx?tr('on'):tr('off')}</button><p>${tr('logo')} — English only.</p>`;
}
applySkin();render();applyStaticLocale();if(pendingOfflineReward>0){toast((s.lang==='ru'?'⏱️ Офлайн-награда: +':'⏱️ Offline reward: +')+fmt(pendingOfflineReward)+' 💰');save()}
</script>
</body></html>
