;line-height:1.05}.wheelDivider{position:absolute;left:50%;top:50%;width:2px;height:119px;transform-origin:50% 0;background:rgba(255,255,255,.55);z-index:2;pointer-events:none}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:8;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:31px solid #fff;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 3px 3px #000)}select{width:100%;padding:11px;background:#25113b;color:#fff;border:1px solid #7642a4;border-radius:10px;margin:6px 0 14px}

function selectDevice(mode){
  const device=mode==='phone'?'phone':'pc';
  const chooser=document.getElementById('deviceChooser');
  const app=document.getElementById('app');
  document.body.classList.remove('mode-pc','mode-phone');
  document.body.classList.add('mode-'+device);
  localStorage.setItem('doom_click_device_mode',device);
  if(chooser) chooser.style.display='none';
  if(app){app.style.display='flex';app.style.visibility='visible';}
  setTimeout(()=>window.scrollTo(0,0),0);
}

  if(b){b.classList.add('previewing');setTimeout(()=>b.classList.remove('previewing'),220);}

function playClickSound(){
  if(!s.sfx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!window.__audioCtx)window.__audioCtx=new AC();
    const ctx=window.__audioCtx, now=ctx.currentTime, type=s.clickSound||'coin';
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.connect(f);f.connect(g);g.connect(ctx.destination);
    let start=300,end=180,dur=.09,wave='square';
    if(type==='vine'){start=90;end=35;dur=.16;wave='sawtooth'}
    if(type==='popcat'){start=220;end=520;dur=.07;wave='triangle'}
    if(type==='bonk'){start=180;end=65;dur=.13;wave='square'}
    if(type==='error'){start=480;end=180;dur=.12;wave='square'}
    if(type==='bruh'){start=110;end=70;dur=.24;wave='sawtooth'}
    if(type==='airhorn'){start=220;end=120;dur=.22;wave='sawtooth'}
    if(type==='coin'){start=760;end=1160;dur=.09;wave='triangle'}
    if(type==='hit'){start=150;end=90;dur=.07;wave='square'}
    if(type==='laser'){start=1000;end=220;dur=.13;wave='sawtooth'}
    if(type==='blip'){start=500;end=800;dur=.06;wave='square'}
    if(type==='power'){start=280;end=980;dur=.25;wave='sine'}
    if(type==='spark'){start=900;end=1600;dur=.08;wave='sine'}
    if(type==='soft'){start=380;end=260;dur=.08;wave='sine'}
    if(type==='bubble'){start=650;end=220;dur=.11;wave='sine'}
    if(type==='wood'){start=180;end=110;dur=.08;wave='triangle'}
    if(type==='glass'){start=1100;end=900;dur=.12;wave='sine'}
    if(type==='chime'){start=700;end=980;dur=.24;wave='sine'}
    if(type==='bell'){start=560;end=420;dur=.28;wave='sine'}
    if(type==='bass'){start=90;end=42;dur=.28;wave='sawtooth'}
    if(type==='explosion'){start=120;end=28;dur=.2;wave='sawtooth'}
    if(type==='shock'){start=180;end=35;dur=.16;wave='square'}
    if(type==='metal'){start=420;end=120;dur=.14;wave='square'}
    if(type==='whoosh'){start=250;end=1400;dur=.18;wave='sawtooth'}
    if(type==='doom'){start=70;end=34;dur=.32;wave='sine'}
    o.type=wave;o.frequency.setValueAtTime(start,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),now+dur);
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.13,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    f.type='lowpass';f.frequency.setValueAtTime(4000,now);
    o.start(now);o.stop(now+dur+.02);
  }catch(e){}
}

    if(found)return found[1];
  }
  return 'Arcade Coin';
}

function saleDiscount(id){
  const hit=(s.saleOffers||[]).find(x=>x.id===id && x.until>Date.now());
  return hit?hit.discount:0;
}
function discounted(value,id){return Math.max(1,Math.floor(value*(1-saleDiscount(id)/100)))}
function upgradeCost(i){const a=A[i],lvl=s.upgrades[i]||0;return Math.floor(a.cost*Math.pow(2.05,lvl))}
function skinCost(k){return {coin:k.coin?discounted(k.coin,'skin:'+k.id):0,crystal:k.crystal?discounted(k.crystal,'skin:'+k.id):0}}
function saleText(id){const d=saleDiscount(id);return d?` <span class="saleBadge">-${d}%</span>`:''}
function startSale(){
  const pool=[...A.map((_,i)=>'upg:'+i),...SKINS.filter(k=>k.id!=='classic').map(k=>'skin:'+k.id),'wheel'];
  const shuffled=pool.sort(()=>Math.random()-.5);
  const count=3+Math.floor(Math.random()*2);
  const duration=30000+Math.floor(Math.random()*45000);
  s.saleOffers=shuffled.slice(0,count).map(id=>({id,discount:[15,20,25,30,35,40][Math.floor(Math.random()*6)],until:Date.now()+duration}));
  s.saleNextAt=Date.now()+90000+Math.random()*150000;
  toast(ui('newSale'));
  save();render();renderLeaderboard();
}
function updateSales(){
  const now=Date.now();
  s.saleOffers=(s.saleOffers||[]).filter(x=>x.until>now);
  if(now>=s.saleNextAt && !s.saleOffers.length)startSale();
}
function buySkin(id){
 const k=SKINS.find(x=>x.id===id); if(!k)return;
 if(s.ownedSkins.includes(id)){s.skin=id;applySkin();save();showShop();return}
 const price=skinCost(k);
 if(s.coins<price.coin||s.crystals<price.crystal){toast(tr('notEnough'));return}
 s.coins-=price.coin;s.crystals-=price.crystal;s.ownedSkins.push(id);s.skin=id;applySkin();checkAchievements();save();showShop();render()
}
function showShop(){
 modalContent.innerHTML=`<h1>🎨 ${s.lang==='ru'?'Магазин оформления':'Interface Shop'}</h1>
 <p>${s.lang==='ru'?'Только внешний вид. Не меняет силу, доход или шансы.':'Cosmetic only. No effect on power, income or chances.'}</p>
 <div class="cosmeticGrid">${SKINS.map(k=>{const owned=s.ownedSkins.includes(k.id),active=s.skin===k.id;
 const cost=[k.coin?fmt(k.coin)+' 💰':'',k.crystal?fmt(k.crystal)+' 💎':''].filter(Boolean).join(' + ')||'FREE';
 return `<div class="skinCard"><div class="skinPreview" style="background:${k.preview}"></div><b>${k.name}</b><small>${k.desc}</small><div>${owned?'OWNED':cost}</div><button class="action compact" onclick="buySkin('${k.id}')">${active?'ACTIVE':owned?'APPLY':'BUY'}</button></div>`}).join('')}</div>`
}
function showGoals(){
  modalContent.innerHTML=`<h1>${ui('goalsTitle')}</h1>
  <p>${ui('goalsDesc')}</p>
  <div class="goalsGrid">${DAILY_GOALS.map(g=>{const key=g.id.startsWith('clicks')?'clicks':g.id,cur=Math.min(g.goal,s.goalStats[key]||0),done=cur>=g.goal,claimed=!!s.goalClaimed[g.id];
  return `<div class="goalCard"><b>${uiObj('goals',g.id)}</b><div class="goalBar"><span style="width:${cur/g.goal*100}%"></span></div><small>${fmt(cur)} / ${fmt(g.goal)}</small><button class="action compact" ${done&&!claimed?'':'disabled'} onclick="claimGoal('${g.id}')">${claimed?ui('claimed'):done?ui('claim'):ui('locked')} · +${g.reward} 💎</button></div>`}).join('')}</div>`
}
function claimGoal(id){const g=DAILY_GOALS.find(x=>x.id===id);if(!g||s.goalClaimed[id])return;const key=g.id.startsWith('clicks')?'clicks':g.id;if((s.goalStats[key]||0)<g.goal)return;s.goalClaimed[id]=1;addCrystals(g.reward);toast('🎯 +'+g.reward+' 💎');save();render();showGoals()}

function levelUp(){
  spawnFx('levelUpFx',950);spawnFx('burst',850);burstSound();
  const b=document.createElement('div');b.className='milestoneText';b.innerHTML='🎉 '+tr('levelUp')+'<small>'+tr('level')+' '+s.level+'</small>';document.body.appendChild(b);setTimeout(()=>b.remove(),1400);
  toast(tr('levelUp'));document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.9) saturate(1.4)'},{filter:'brightness(1)'}],650)
}
function clickBonusChance(){
  const lvl=s.upgrades[0]||0;
  if(lvl<10)return 0;
  return Math.max(.25,.75-(lvl-10)*.05);
}
function buy(i){
  let a=A[i],lvl=s.upgrades[i]||0,baseCost=upgradeCost(i),cost=discounted(baseCost,'upg:'+i);
  if(s.coins<cost){toast(tr('notEnough'));return}
  s.coins-=cost;s.upgrades[i]=lvl+1;
  if(i===0){
    s.power+=1;
    const chance=clickBonusChance();
    if(chance>0 && Math.random()<chance){
      s.power+=1;s.upgrades[i]+=1;
      toast('🍀 '+(s.lang==='ru'?'БОНУСНАЯ ПРОКАЧКА!':'BONUS UPGRADE!')+' +1');
    }
  }
  if(i===1)s.auto+=2;
  if(i===2)s.autoSpeed+=1;
  if(i===4)s.crit=Math.min(.5,(s.crit||0)+.02);
  if(i===5)s.comboPower=(s.comboPower||0)+.05;
  if(i===6)s.offline=Math.min(3,(s.offline||0)+.10);
  if(i===7)s.luck=Math.min(.5,(s.luck||0)+.03);
  if(i===8)s.comboPower=(s.comboPower||0)+.10;
  toast(tr('purchased'));render();save()
}
let activeEvent=null,eventTimer=0,eventNextAt=Date.now()+60000+Math.random()*60000;
const EVENT_KEYS=Object.keys(T.en.events);
function scheduleNextEvent(){
  eventNextAt=Date.now()+(60000+Math.random()*120000);
}
function startRandomEvent(){
  if(eventTimer>0)return;
  const key=EVENT_KEYS[Math.floor(Math.random()*EVENT_KEYS.length)];
  activeEvent=key;
  eventTimer=Math.floor(3+Math.random()*3);
  s.events++;s.goalStats.events++;
  eventBox.style.display='block';
  updateEventBox();
  if(key==='bonus'){const prize=Math.max(20,getClickPower()*5);addCoins(prize);toast('👹 +'+fmt(prize)+' 💰 '+ui('coinsWord'))}
  if(key==='meteor'){addCrystals(1);toast('☄️ +1 💎 '+ui('crystalsWord'))}
  if(key==='void'){addCrystals(1);toast('🕳️ +1 💎 '+ui('crystalsWord'))}
  scheduleNextEvent();
  render();save();
}
function updateEventBox(){
  if(!activeEvent){eventBox.style.display='none';return}
  const data=(T[s.lang].events[activeEvent]||T.en.events[activeEvent]);
  eventBox.innerHTML=`<b>${data[0]}</b>${data[1]} · <span id="eventTime">${eventTimer}</span> ${tr('seconds')}`;
}
setInterval(()=>{
  const now=Date.now();
  if(eventTimer>0){eventTimer--;updateEventBox();if(eventTimer<=0){activeEvent=null;eventBox.style.display='none';scheduleNextEvent();}}
  else if(now>=eventNextAt)startRandomEvent();
  updateSales();
  render();
},1000);
let autoAccumulator=0;
setInterval(()=>{
  if(s.auto){
    autoAccumulator+=getAutoClicksPerSecond()/10;
    let clicksThisTick=0;
    while(autoAccumulator>=1 && clicksThisTick<10){
      autoAccumulator-=1;
      let gain=2*(1+s.rebirth*.1);
      if(activeEvent==='time')gain*=1.5;
      if(activeEvent==='gold')gain*=1.25;
      addCoins(gain);s.xp+=gain;
      clicksThisTick++;
    }
    while(s.xp>=levelNeed()){s.xp-=levelNeed();s.level++;addCrystals(2);levelUp()}
    render();save();
  }
},100);
setInterval(()=>{
  const now=Date.now(),delta=Math.max(0,now-(s.lastSeen||now));
  s.timePlayed+=delta/1000;s.lastSeen=now;save();
  render();
},5000);
function claimAd(){addCrystals(25);toast(tr('video'));save();render()}
function openModal(type){modal.classList.add('open');if(type==='achievements')showAchievements();if(type==='wheel')showWheel();if(type==='rebirth')showRebirth();if(type==='settings')showSettings();if(type==='shop')showShop();if(type==='goals')showGoals()}
function closeModal(){modal.classList.remove('open')}
function checkAchievements(){
  const owned=s.ownedSkins||['classic'];
  const cosmeticProgress={
    skin_cyber:owned.includes('cyber')?1:0,
    skin_inferno:owned.includes('inferno')?1:0,
    skin_void:owned.includes('void')?1:0,
    skin_matrix:owned.includes('matrix')?1:0,
    skin_royal:owned.includes('royal')?1:0,
    skins_all:SKINS.every(k=>owned.includes(k.id))?1:0
  };
  achievements.forEach(a=>{
    const current=Object.prototype.hasOwnProperty.call(cosmeticProgress,a[0])?cosmeticProgress[a[0]]:(s[a[3]]||0);
    if(!s.ach[a[0]] && current>=a[2]){
      s.ach[a[0]]=1;
      addCrystals(a[5]);
      toast('🏆 '+(T[s.lang].ach[a[0]]||a[1])+' +'+a[5]+' 💎');
      save();
    }
  });
}
function showAchievements(){
  modalContent.innerHTML='<h1>🏆 '+tr('achievements')+'</h1>'+achievements.map(a=>{
    const val=s[a[3]]||0,done=val>=a[2],name=T[s.lang].ach[a[0]]||a[1];
    return `<div class="achievement ${done?'':'locked'}"><span>${done?'🏆':'🔒'} ${done?name:tr('mystery')}</span><b>${done?'+'+a[5]+' 💎':tr('mystery')}</b></div>`;
  }).join('');
}

const FORTUNE_PRIZES=[
  {amount:10,type:'coins'},
  {amount:3,type:'crystals'},
  {amount:50,type:'coins'},
  {amount:7,type:'crystals'},
  {amount:250,type:'coins'},
  {amount:15,type:'crystals'},
  {amount:1000,type:'coins'},
  {amount:60,type:'crystals'}
];
const FORTUNE_COLORS=['#ff3f9d','#32dfff','#713dff','#18e0a8','#ffb52f','#9d4cff','#ff5b5b','#24d9ff'];
let fortuneRotation=0;
let fortuneSpinning=false;
let fortuneTimer=null;

function showWheel(){
  const cost=150;
  const sectors=FORTUNE_PRIZES.map((prize,i)=>{
    const icon=prize.type==='crystals'?'💎':'💰';
    const label=prize.type==='crystals'?ui('crystalsWord'):ui('coinsWord');
    return `<div class="fortuneSector" style="--mid:${i*45+22.5}deg"><span class="fortuneSectorIcon">${icon}</span><b>${fmt(prize.amount)}</b><small>${label}</small></div>`;
  }).join('');
  modalContent.innerHTML=`
    <div class="fortuneHead"><h1>🎡 ${tr('fortune')}</h1><div class="fortuneBalance">💎 ${fmt(s.crystals)}</div></div>
    <p class="fortuneCost">${tr('spinCost')}: <strong>${cost} 💎</strong></p>
    <div class="wheelStage">
      <div class="pointer"></div>
      <div id="fortuneWheel" class="wheel fortuneWheel">
        <div class="fortuneDisc">${sectors}</div>
        <div class="wheelRing"></div>
        <div class="wheelCenter"><span>🎡</span><small>${ui('spin')}</small></div>
      </div>
    </div>
    <div class="wheelLegend">${FORTUNE_PRIZES.map((prize,i)=>{const icon=prize.type==='crystals'?'💎':'💰';const label=prize.type==='crystals'?ui('crystalsWord'):ui('coinsWord');return `<span><i style="background:${FORTUNE_COLORS[i]}"></i><b>${fmt(prize.amount)}</b> ${icon} ${label}</span>`}).join('')}</div>
    <div class="fortuneHint">${ui('wheelHint')}</div>
    <button id="spinWheelBtn" class="action fortuneSpin" type="button" ${fortuneSpinning?'disabled':''}>${ui('spin')} — ${cost} 💎</button>`;
  const btn=document.getElementById('spinWheelBtn');
  if(btn)btn.addEventListener('click',spin,{once:false});
}
function spin(){
  if(fortuneSpinning)return;
  const cost=150;
  const wheel=document.getElementById('fortuneWheel');
  const btn=document.getElementById('spinWheelBtn');
  if(!wheel||!btn)return;
  if(s.crystals<cost){toast(ui('needWheel'));return;}
  fortuneSpinning=true;
  btn.disabled=true;
  s.crystals-=cost;
  const prizeIndex=Math.floor(Math.random()*FORTUNE_PRIZES.length);
  const prize=FORTUNE_PRIZES[prizeIndex];
  const center=prizeIndex*45+22.5;
  const current=((fortuneRotation%360)+360)%360;
  const target=(360-center+360)%360;
  let delta=(target-current+360)%360;
  if(delta<180)delta+=360;
  fortuneRotation+=(4+Math.floor(Math.random()*3))*360+delta;
  wheel.style.transform=`rotate(${fortuneRotation}deg)`;
  save();
  render();
  clearTimeout(fortuneTimer);
  fortuneTimer=setTimeout(()=>{
    if(prize.type==='crystals') addCrystals(prize.amount); else addCoins(prize.amount);
    s.wheel++;
    checkAchievements();
    fortuneSpinning=false;
    const icon=prize.type==='crystals'?'💎':'💰';
    const label=prize.type==='crystals'?ui('crystalsWord'):ui('coinsWord');
    toast(ui('wonPrefix')+fmt(prize.amount)+' '+icon+' '+label+'!');
    save();
    render();
    showWheel();
    fortuneRotation=0;
  },2850);
}

function openWheel(ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const modalEl=document.getElementById('modal');
  const contentEl=document.getElementById('modalContent');
  if(!modalEl||!contentEl)return;
  modalEl.classList.add('open');
  showWheel();
}

function showRebirth(){
  let cost=10000*(s.rebirth+1), nextBonus=(s.rebirth+1)*10;
  modalContent.innerHTML=`<h1>${tr('rebirthTitle')}</h1>
  <p>${tr('rebirthDesc')}</p>
  <div class="rebirthCard">
    <b>${tr('currentBonus')}</b>
    <strong>+${s.rebirth*10}%</strong>
    <small>${s.rebirth===0?ui('rebirthNow'):ui('rebirthAll')}</small>
  </div>
  <div class="rebirthCard next">
    <b>${ui('rebirthNext')}</b>
    <strong>+${nextBonus}%</strong>
    <small>${ui('rebirthNextDesc')}</small>
  </div>
  <p>${tr('nextCost')}: <b>${fmt(cost)} 💰</b></p>
  <button class="action" onclick="doRebirth(${cost})">${tr('doRebirth')}</button>`;
}
function doRebirth(cost){
  if(s.coins<cost){toast(tr('notEnough'));return}
  s.rebirth++;s.coins=0;s.power=1;s.auto=0;s.level=1;s.xp=0;s.combo=0;
  s.upgrades=[0,0,0,0,0,0,0,0,0];s.autoSpeed=0;s.crit=0;s.luck=0;s.comboPower=0;s.offline=0;
  addCrystals(50);checkAchievements();toast(tr('rebirthReward'));save();render();closeModal()
}
function showSettings(){
 const groups=[['meme','meme'],['popular','popular'],['calm','calm'],['extreme','extreme']];
 const list=groups.map(([g,key])=>`<div class="soundGroup"><h3>${uiObj('soundGroups',key)}</h3>`+CLICK_SOUNDS[g].map(([id,name])=>`<div class="soundOption ${s.clickSound===id?'selected':''}"><span>${uiObj('sounds',id)}</span><button class="soundMiniBtn" onclick="previewSoundById('${id}')">${ui('play')}</button><button class="soundMiniBtn choose" onclick="s.clickSound='${id}';save();showSettings()">${ui('choose')}</button></div>`).join('')+'</div>').join('');
 modalContent.innerHTML=`<h1>⚙️ ${tr('settings')}</h1>
 <label>${tr('lang')}</label><select onchange="s.lang=this.value;save();render();showSettings();updateEventBox()"><option value="ru" ${s.lang==='ru'?'selected':''}>Русский</option><option value="en" ${s.lang==='en'?'selected':''}>English</option></select>
 <p class="soundPreview">${ui('selectedSound')}: <b>${uiObj('sounds',s.clickSound)}</b></p>${list}
 <button class="upgrade" onclick="s.music=!s.music;save();showSettings()">${tr('music')}: ${s.music?tr('on'):tr('off')}</button>
 <button class="upgrade" onclick="s.sfx=!s.sfx;save();showSettings()">${tr('sounds')}: ${s.sfx?tr('on'):tr('off')}</button><p>${tr('logo')} — ${ui('logoOnly')}.</p>`;
}
applySkin();render();applyStaticLocale();if(pendingOfflineReward>0){toast(ui('offlineReward')+fmt(pendingOfflineReward)+' 💰');save()}
</script>
</body></html>
